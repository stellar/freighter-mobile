name: "Validate Branch From"
description:
  "Validates that branch_from is the base branch or a vX.Y.Z tag and provides
  available version tags"

inputs:
  branch_from:
    description:
      "The source ref to branch from: either the base branch or a version tag of
      the form vX.Y.Z"
    required: true
  base_branch:
    description: "The branch regular releases are cut from"
    required: false
    default: "main"

outputs:
  is_valid:
    description:
      "Whether the branch_from input is the base branch or a valid vX.Y.Z tag"
    value: ${{ steps.validate.outputs.is_valid }}
  branch_or_tag:
    description:
      "The validated source ref name (the base branch or a vX.Y.Z tag)"
    value: ${{ steps.validate.outputs.branch_or_tag }}

runs:
  using: "composite"
  steps:
    - name: Fetch tags
      id: fetch_tags
      shell: bash
      run: |
        # Fetch all tags
        git fetch --tags 2>/dev/null || true

        # Get last 10 version tags
        TAGS=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 10)

        # Store tags in output (comma-separated for display)
        TAGS_CSV=$(echo "$TAGS" | tr '\n' ',' | sed 's/,$//')
        echo "tags=$TAGS_CSV" >> $GITHUB_OUTPUT

        # Store tags as multiline for display
        {
          echo "tags_list<<EOF"
          echo "$TAGS"
          echo "EOF"
        } >> $GITHUB_OUTPUT

        echo "Available tags:"
        echo "$TAGS" | while read tag; do
          echo "  - $tag"
        done

    - name: Validate branch_from
      id: validate
      shell: bash
      env:
        RAW_BRANCH_FROM: ${{ inputs.branch_from }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        FETCHED_TAGS: ${{ steps.fetch_tags.outputs.tags_list }}
      run: |
        BRANCH_FROM="$RAW_BRANCH_FROM"
        TAGS="$FETCHED_TAGS"

        # Check if it's the base branch
        if [ "$BRANCH_FROM" = "$BASE_BRANCH" ]; then
          echo "✓ Using $BASE_BRANCH branch as base"
          echo "is_valid=true" >> $GITHUB_OUTPUT
          echo "branch_or_tag=$BASE_BRANCH" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Normalize tag format: add "v" prefix if missing
        # Check if it matches version format without "v" (e.g., 1.9.24)
        if [[ "$BRANCH_FROM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          BRANCH_FROM="v${BRANCH_FROM}"
          echo "Normalized to: $BRANCH_FROM"
        fi

        # Check if it's a valid tag format (with "v" prefix)
        if [[ ! "$BRANCH_FROM" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "❌ Error: Invalid format. Must be '$BASE_BRANCH' or a version tag like 'v1.9.24' or '1.9.24'"
          echo ""
          echo "Available tags (last 10):"
          echo "$TAGS" | while read tag; do
            echo "  - $tag"
          done
          echo "is_valid=false" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Verify the tag exists
        if git rev-parse "$BRANCH_FROM" >/dev/null 2>&1; then
          echo "✓ Using tag $BRANCH_FROM as base"
          echo "is_valid=true" >> $GITHUB_OUTPUT
          echo "branch_or_tag=$BRANCH_FROM" >> $GITHUB_OUTPUT
        else
          echo "❌ Error: Tag $BRANCH_FROM does not exist"
          echo ""
          echo "Available tags (last 10):"
          echo "$TAGS" | while read tag; do
            echo "  - $tag"
          done
          echo "is_valid=false" >> $GITHUB_OUTPUT
          exit 1
        fi
