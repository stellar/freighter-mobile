appId: org.stellar.freighterdev
tags:
  - accounts
  - onboarding
env:
  # Test-only key: generated for this suite, never funded.
  TEST_SECRET_KEY: SCU2DXAHFLNUTFWKUVZUTRMZWGMCJT2HNYFOVHY4HO4BTLT7IBPM72GE
---
# A wallet onboarded from a secret key has no recovery phrase, so nothing in
# the app may offer one: not Create new wallet, not Security, not Edit account.
- runFlow:
    file: ../shared/ImportSecretKeyAtOnboarding.yaml

# Create new wallet: only "New recovery phrase". A phrase would add a group
# with its own "Add account" row.
- runFlow:
    file: ../shared/OpenAddWallet.yaml
- tapOn:
    id: add-wallet-create
# The options render once the wallet's sources are read, so this option being
# up means a phrase group would be up too.
- extendedWaitUntil:
    visible:
      id: create-wallet-generate
    timeout: 15000
- assertNotVisible:
    id: create-wallet-group
- assertNotVisible:
    id: create-wallet-add-account

# Back to Home: Create new wallet → Add wallet chooser → Home
- tapOn:
    id: header-button
- extendedWaitUntil:
    visible:
      id: add-wallet-create
    timeout: 15000
- tapOn:
    id: header-button
- extendedWaitUntil:
    notVisible:
      id: add-wallet-create
    timeout: 15000

# Settings → Security: no "Show recovery phrase" row. The row starts out
# shown and hides once the sources are read, so wait for the screen first;
# checking earlier would pass before the row had a chance to render.
- runFlow:
    file: ../shared/OpenManageAccountsSheet.yaml
- tapOn:
    id: security-button
- extendedWaitUntil:
    visible:
      id: auto-lock-button
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: show-recovery-phrase-button
    timeout: 10000

# Settings → Accounts & recovery → Edit account: a secret key row and no
# recovery phrase row.
- tapOn:
    id: header-button
- extendedWaitUntil:
    visible:
      id: settings-accounts-recovery
    timeout: 15000
- tapOn:
    id: settings-accounts-recovery
- extendedWaitUntil:
    visible:
      id: accounts-recovery-edit
    timeout: 15000
- tapOn:
    id: accounts-recovery-edit
- extendedWaitUntil:
    visible:
      id: edit-account-secret-key
    timeout: 15000
- extendedWaitUntil:
    notVisible:
      id: edit-account-recovery-phrase
    timeout: 10000
