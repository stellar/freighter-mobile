appId: org.stellar.freighterdev
tags:
  - accounts
  - reveal
env:
  # Test-only key: generated for this suite, never funded.
  TEST_SECRET_KEY: SCU2DXAHFLNUTFWKUVZUTRMZWGMCJT2HNYFOVHY4HO4BTLT7IBPM72GE
---
# Edit account reveals a recovery phrase and an imported secret key. Each
# reveal rejects a wrong password and then shows the exact value.
- runFlow:
    file: ../onboarding/ImportWallet.yaml

# --- Recovery phrase, from the phrase wallet's first account ---
- runFlow:
    file: ../shared/OpenAccountsRecovery.yaml
- tapOn: "Edit Account 1"
- extendedWaitUntil:
    visible:
      id: edit-account-recovery-phrase
    timeout: 15000
- tapOn:
    id: edit-account-recovery-phrase
- tapOn:
    id: reveal-recovery-phrase-acknowledge
- tapOn:
    id: reveal-recovery-phrase-continue

- tapOn:
    id: reveal-recovery-phrase-password
- inputText: "WrongPassword1!"
- tapOn:
    id: reveal-recovery-phrase-submit
- extendedWaitUntil:
    visible: "Invalid password. Please try again."
    timeout: 15000
- assertNotVisible:
    id: reveal-recovery-phrase-value

# Clear the field, or the next submit sends both passwords.
- tapOn:
    id: reveal-recovery-phrase-password
- eraseText
- inputText: "TestPassword123!"
- tapOn:
    id: reveal-recovery-phrase-submit
- extendedWaitUntil:
    visible:
      id: reveal-recovery-phrase-value
    timeout: 15000
# The first and last words of the imported phrase. iOS lists a cell's texts
# beside the cell, not inside it, so they can't be tied to their cells.
- assertVisible: ${E2E_TEST_RECOVERY_PHRASE.trim().split(/\s+/)[0]}
- assertVisible: ${E2E_TEST_RECOVERY_PHRASE.trim().split(/\s+/).pop()}
- assertVisible:
    id: recovery-phrase-word-${E2E_TEST_RECOVERY_PHRASE.trim().split(/\s+/).length}
- tapOn:
    id: reveal-recovery-phrase-done

# Back to Home: Edit account → Accounts & recovery → Settings → Home
- extendedWaitUntil:
    visible:
      id: edit-account-screen
    timeout: 15000
- tapOn:
    id: header-button
- extendedWaitUntil:
    visible:
      id: accounts-recovery-edit
    timeout: 15000
- tapOn:
    id: header-button
- extendedWaitUntil:
    visible:
      id: settings-accounts-recovery
    timeout: 15000
- tapOn:
    id: header-button
- extendedWaitUntil:
    notVisible:
      id: settings-accounts-recovery
    timeout: 15000

# --- Secret key, from an imported account ---
- runFlow:
    file: ../shared/AddImportedSecretKey.yaml
- runFlow:
    file: ../shared/OpenAccountsRecovery.yaml
# The imported account's default name depends on how many accounts the phrase
# brought in, so find its Edit button by its group.
- scrollUntilVisible:
    element: "Secret key 1"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: accounts-recovery-edit
    below: "Secret key 1"
- extendedWaitUntil:
    visible:
      id: edit-account-secret-key
    timeout: 15000
# An imported key has no phrase behind it.
- extendedWaitUntil:
    notVisible:
      id: edit-account-recovery-phrase
    timeout: 10000
- tapOn:
    id: edit-account-secret-key
- tapOn:
    id: reveal-secret-key-acknowledge
- tapOn:
    id: reveal-secret-key-continue

- tapOn:
    id: reveal-secret-key-password
- inputText: "WrongPassword1!"
- tapOn:
    id: reveal-secret-key-submit
- extendedWaitUntil:
    visible: "Invalid password. Please try again."
    timeout: 15000
- assertNotVisible:
    id: reveal-secret-key-value

- tapOn:
    id: reveal-secret-key-password
- eraseText
- inputText: "TestPassword123!"
- tapOn:
    id: reveal-secret-key-submit
- extendedWaitUntil:
    visible:
      id: reveal-secret-key-value
      text: ${TEST_SECRET_KEY}
    timeout: 15000
