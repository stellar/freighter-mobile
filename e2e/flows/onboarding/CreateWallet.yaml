appId: org.stellar.freighterdev
tags:
  - onboarding
  - create-wallet
---
# Launch app and wait for welcome screen; retry up to 3 times (2 min wait each) if not visible
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - extendedWaitUntil:
          visible:
            id: welcome-screen
          timeout: 120000 # 2 minutes

# Tap create wallet button
- tapOn:
    id: create-wallet-button

# Set Password: the password and its confirmation on one screen
- assertVisible:
    id: password-input
- tapOn:
    id: password-input
- inputText: "TestPassword123!"
- tapOn:
    id: confirm-password-input
- inputText: "TestPassword123!"
- hideKeyboard
- tapOn:
    id: default-action-button

# Recovery Phrase: reveal it, then Next (there is no verification step)
- tapOn:
    id: reveal-recovery-phrase-button
# The reveal animates, and the screen takes no taps until it settles
- waitForAnimationToEnd
- assertVisible:
    id: copy-recovery-phrase-button
- tapOn:
    id: default-action-button

# Wait for wallet creation to complete
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000

# The wallet setup screen covers Home until Home's balances are in, for 3s at
# most after setup. Maestro doesn't check what covers an element, so Home
# counts as visible beneath it: wait for the screen itself to go. Home mounts
# before setup resolves, and loading the account can keep the JS thread busy
# for seconds on a slow emulator, so the ceiling is generous.
- extendedWaitUntil:
    notVisible:
      id: wallet-setup-overlay
    timeout: 60000
