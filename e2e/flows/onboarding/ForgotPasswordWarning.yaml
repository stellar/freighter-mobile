appId: org.stellar.freighterdev
tags:
  - lock-screen
  - forgot-password
---
# Create a wallet so there is an account to forget
- runFlow:
    file: ../onboarding/CreateWallet.yaml

# Wait for home screen to fully settle after wallet creation
- extendedWaitUntil:
    visible:
      id: home-account-switcher
    timeout: 15000

# Open settings via the manage-accounts sheet (settings moved there from the
# old header context menu), then tap the "Logout" option. logout() without
# wipeAllData=true puts the app into AUTH_STATUS.LOCKED and navigates to the
# Lock Screen.
#
# CreateWallet leaves a fresh unfunded account, so the "Welcome to Freighter!"
# sheet can still be mounting when we reach the header. The shared flow
# dismisses it and retries the whole navigation to Settings, so a late mount
# cannot swallow a tap. It returns with `settings-screen` visible.
- runFlow:
    file: ../shared/OpenManageAccountsSheet.yaml
- extendedWaitUntil:
    visible:
      id: logout-button
    timeout: 10000
- tapOn:
    id: logout-button
- extendedWaitUntil:
    visible:
      id: lock-screen
    timeout: 30000

# Dismiss keyboard auto-focused by the password input, then tap "Forgot password".
# hideKeyboard returns as soon as the dismissal is dispatched, so wait for the
# button to actually be hittable — tapping straight after the keyboard starts
# animating away raised "Element not found: forgot-password-button" on Android.
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: forgot-password-button
    timeout: 15000
- tapOn:
    id: forgot-password-button
- extendedWaitUntil:
    visible:
      id: forgot-password-warning-modal
    timeout: 5000
- assertVisible:
    id: forgot-password-warning-cancel-button
- assertVisible:
    id: forgot-password-warning-continue-button

# Tapping Cancel dismisses the sheet; user stays on the Lock Screen
- tapOn:
    id: forgot-password-warning-cancel-button
- extendedWaitUntil:
    notVisible:
      id: forgot-password-warning-modal
    timeout: 5000
- assertVisible:
    id: lock-screen

# Reopen, confirm, and verify we land back on the Welcome screen
- tapOn:
    id: forgot-password-button
- extendedWaitUntil:
    visible:
      id: forgot-password-warning-modal
    timeout: 5000
- tapOn:
    id: forgot-password-warning-continue-button
# Confirming wipes all data and rebuilds the onboarding stack; this has needed
# more than 30s on loaded CI simulators, so allow 60s before calling it a bug.
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
