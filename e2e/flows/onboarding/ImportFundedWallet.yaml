appId: org.stellar.freighterdev
tags:
  - onboarding
  - import-wallet
  - funded
---
# Launch app and wait for welcome screen; retry up to 3 times (2 min wait each) if not visible
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - extendedWaitUntil:
          visible:
            id: welcome-screen
          timeout: 120000 # 2 minutes

# Tap import wallet button
- tapOn:
    id: import-wallet-button

# Import wallet screen - enter recovery phrase for funded wallet
#
# Phrase: CI uses secrets.E2E_TEST_FUNDED_RECOVERY_PHRASE; local uses .env E2E_TEST_FUNDED_RECOVERY_PHRASE.
#
# iOS: Use clipboard (phrase set by run-e2e-tests.sh / CI workflow). Tap app's clipboard button to paste.
#      Avoids iOS Simulator occasionally skipping letters when typing. Handle "Allow Paste" if shown.
#
# Android: Use inputText to type the recovery phrase (covers typing UX).
#
- assertVisible:
    id: import-wallet-input
# iOS: Clipboard approach
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          id: clipboard-button
      - runFlow:
          when:
            visible:
              text: "Allow Paste|Don't Allow Paste"
          commands:
            - tapOn:
                text: "Allow Paste"
            # Wait for the allow paste dialog to fully dismiss
            - extendedWaitUntil:
                notVisible:
                  text: "Allow Paste|Don't Allow Paste"
                timeout: 5000
# Android: inputText approach
- runFlow:
    when:
      platform: android
    commands:
      - tapOn:
          id: import-wallet-input
      - inputText: "${E2E_TEST_FUNDED_RECOVERY_PHRASE}"
      - hideKeyboard
# Import Wallet: Next checks the phrase
- tapOn:
    id: default-action-button

# Set Password: the password, its confirmation and the acknowledgement
- assertVisible:
    id: password-input
- tapOn:
    id: password-input
- inputText: "TestPassword123!"
- tapOn:
    id: confirm-password-input
- inputText: "TestPassword123!"
# The keyboard's done key, as a user would close it: hideKeyboard can't
# dismiss the iOS keyboard on this screen. Unticked, the acknowledgement
# keeps it from submitting.
- pressKey: Enter
- tapOn:
    id: import-acknowledgement-checkbox
- tapOn:
    id: default-action-button

# Wait for import to complete - wait for either home screen or account switcher
- extendedWaitUntil:
    visible:
      id: home-screen|home-account-switcher
    timeout: 60000

# The wallet setup screen covers Home until Home's balances are in, for 3s at
# most after setup. Maestro doesn't check what covers an element, so Home
# counts as visible beneath it: wait for the screen itself to go. Home mounts
# before setup resolves, and loading the account can keep the JS thread busy
# for seconds on a slow emulator, so the ceiling is generous.
- extendedWaitUntil:
    notVisible:
      id: wallet-setup-overlay
    timeout: 60000
