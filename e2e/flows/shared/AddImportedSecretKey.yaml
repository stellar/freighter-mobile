appId: org.stellar.freighterdev
---
# Shared flow: from the home screen of an unlocked wallet, import a secret key
# as an additional account. Returns on the home screen with the imported
# account active.
#
# Env:
#   TEST_SECRET_KEY: the secret key to import
#
# One retryable unit. A failed attempt leaves the import form up with a
# half-used state (text in both fields, the checkbox ticked), so each attempt
# first backs out to the chooser and opens a fresh form.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible:
              id: secret-key-input
          commands:
            - runFlow:
                when:
                  platform: android
                commands:
                  - hideKeyboard
            - tapOn:
                id: header-button
            - extendedWaitUntil:
                visible:
                  id: add-wallet-import-secret-key
                timeout: 15000
      - runFlow:
          when:
            notVisible:
              id: add-wallet-import-secret-key
          commands:
            - runFlow:
                file: OpenAddWallet.yaml
      - tapOn:
          id: add-wallet-import-secret-key
      - runFlow:
          file: EnterSecret.yaml
          env:
            FIELD_ID: secret-key-input
            SECRET: ${TEST_SECRET_KEY}
      - tapOn:
          id: secret-key-password-input
      - inputText: "TestPassword123!"
      # The keyboard covers the checkbox and the button.
      - runFlow:
          when:
            platform: android
          commands:
            - hideKeyboard
      - runFlow:
          when:
            platform: ios
          commands:
            - pressKey: Enter
      - tapOn:
          id: import-secret-key-aware-checkbox
      - tapOn:
          id: import-secret-key-submit
      # The import resets navigation to the main tabs. Wait for the form to
      # go first: a screen under the stack can still count as visible, so the
      # home header alone wouldn't prove the import finished.
      - extendedWaitUntil:
          notVisible:
            id: import-secret-key-submit
          timeout: 60000
      - extendedWaitUntil:
          visible:
            id: home-account-switcher
          timeout: 30000
