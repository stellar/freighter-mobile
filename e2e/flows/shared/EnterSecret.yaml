appId: org.stellar.freighterdev
---
# Shared flow: type a secret (a secret key or a recovery phrase) into a field.
#
# Env:
#   FIELD_ID: testID of the input
#   SECRET:   the value to type
#
# Typed on both platforms. A flow can't put its own value on the pasteboard
# the app's paste button reads: Maestro's setClipboard only fills Maestro's
# internal clipboard. The iOS simulator can drop a letter while typing, so
# callers run this inside a `retry` that starts from a fresh field and ends on
# a check that only a correct value passes.
#
# The keyboard is left up; the caller closes it the way its screen needs.
- extendedWaitUntil:
    visible:
      id: ${FIELD_ID}
    timeout: 15000
- tapOn:
    id: ${FIELD_ID}
- inputText: ${SECRET}
