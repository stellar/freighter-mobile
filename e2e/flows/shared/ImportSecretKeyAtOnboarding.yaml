appId: org.stellar.freighterdev
---
# Shared flow: onboard a fresh install by importing a secret key. Returns on
# the home screen with the setup overlay gone.
#
# Env:
#   TEST_SECRET_KEY: the secret key to import
#
# One retryable unit from launch to the password step. Each attempt clears the
# app, so a key typed with a dropped letter is retried on an empty field. The
# acknowledgement check proves the app read a secret key and not a phrase.
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          clearState: true
          clearKeychain: true
      - extendedWaitUntil:
          visible:
            id: welcome-screen
          timeout: 120000 # 2 minutes
      - tapOn:
          id: import-wallet-button
      - runFlow:
          file: EnterSecret.yaml
          env:
            FIELD_ID: import-wallet-input
            SECRET: ${TEST_SECRET_KEY}
      - runFlow:
          when:
            platform: android
          commands:
            - hideKeyboard
      # Import Wallet: Next checks the key
      - tapOn:
          id: default-action-button
      - extendedWaitUntil:
          visible:
            id: password-input
          timeout: 15000

# Set Password: same steps as onboarding/ImportWallet.yaml
- tapOn:
    id: password-input
- inputText: "TestPassword123!"
- tapOn:
    id: confirm-password-input
- inputText: "TestPassword123!"
- pressKey: Enter
- tapOn:
    id: import-acknowledgement-checkbox
- tapOn:
    id: default-action-button

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 60000
# The setup screen covers Home until balances are in; see ImportWallet.yaml.
- extendedWaitUntil:
    notVisible:
      id: wallet-setup-overlay
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: home-account-switcher
    timeout: 30000
