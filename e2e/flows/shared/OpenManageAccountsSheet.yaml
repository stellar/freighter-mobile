appId: org.stellar.freighterdev
---
# Shared flow: go from the home screen to the Settings screen via the
# manage-accounts sheet. Returns with `settings-screen` visible.
#
# The whole navigation — open the sheet, tap settings, confirm we landed — is
# one retryable unit. Success cannot be reported until Settings is actually on
# screen, so an overlay that eats a tap, such as the "Account not loaded"
# toast, fails the unit rather than leaking a broken state to the caller. Taps
# report COMPLETED because the tap itself succeeded, so without the retry the
# failure would only surface later as an unrelated-looking timeout.
#
# Each attempt starts by restoring a known state, so the unit is idempotent
# whether the previous attempt left us on the home screen or with the
# manage-accounts sheet already open.
- retry:
    maxRetries: 2
    commands:
      # If a previous attempt got as far as opening the manage-accounts sheet,
      # close it so the account-switcher tap below starts from the home screen.
      - runFlow:
          when:
            visible:
              id: manage-accounts-close-button
          commands:
            - tapOn:
                id: manage-accounts-close-button
            - extendedWaitUntil:
                notVisible:
                  id: manage-accounts-close-button
                timeout: 15000

      # An "Account not loaded" toast can also overlay the top of the header.
      # It auto-dismisses in 6s, but swiping is faster and deterministic.
      - runFlow:
          when:
            visible: ".*could not be loaded.*"
          commands:
            - swipe:
                from:
                  text: ".*could not be loaded.*"
                direction: UP

      - tapOn:
          id: home-account-switcher
      - extendedWaitUntil:
          visible:
            id: manage-accounts-settings-button
          timeout: 15000
      - tapOn:
          id: manage-accounts-settings-button
      - extendedWaitUntil:
          visible:
            id: settings-screen
          timeout: 15000
