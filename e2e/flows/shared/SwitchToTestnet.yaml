appId: org.stellar.freighterdev
---
# Shared flow: switch the active network to Testnet, called right after the
# wallet has been imported. Exits back to home screen. Used by the transaction
# flows that run on testnet (Send/Swap, FromDetails) and by the standalone
# ImportAndSwitchToTestnet flow.
#
# Freshly imported wallets land on Mainnet where the account is unfunded, so
# the "Welcome to Freighter!" bottom sheet usually appears and covers the
# header (including the account switcher). And if the Mainnet account fetch
# flakes, an "Account not loaded" toast appears at the top and also overlays
# the header. Both are handled by OpenManageAccountsSheet.yaml, which retries
# so neither overlay can block the network-switch tap.
#
# Timeouts on the network-switch UI are generous (15s) for the post-switch
# back-nav because the app refetches balances on the new network.

# 1. Wait for the home screen to reach a steady post-load state — either the
#    "Welcome to Freighter!" bottom sheet (fresh testnet-only account shown as
#    unfunded on Mainnet) or the XLM balance row (static funded Mainnet account
#    already loaded). Both are end-states, not the racy "home-screen rendered"
#    signal that the calling flows used to wait for.
- extendedWaitUntil:
    visible:
      id: home-token-XLM|welcome-banner-dismiss-button
    timeout: 30000

# 2. Navigate to Settings via the manage-accounts sheet (settings moved there
#    from the old header context menu). The shared flow dismisses the welcome
#    sheet and the "Account not loaded" toast if either is overlaying the
#    header, and retries the whole navigation so a late-mounting sheet cannot
#    swallow a tap. It returns with `settings-screen` visible.
- runFlow:
    file: OpenManageAccountsSheet.yaml

# Wait for change network button to be visible (confirms settings screen loaded)
- extendedWaitUntil:
    visible:
      id: change-network-button
    timeout: 15000

# Open change network screen
- tapOn:
    id: change-network-button

- extendedWaitUntil:
    visible:
      id: change-network-selector
    timeout: 15000

# Open network selector bottom sheet
- tapOn:
    id: change-network-selector

- extendedWaitUntil:
    visible:
      id: change-network-option-testnet
    timeout: 15000

- tapOn:
    id: change-network-option-testnet

# Return to home screen
- tapOn:
    id: header-button

- extendedWaitUntil:
    visible:
      id: change-network-button
    timeout: 15000

- tapOn:
    id: header-button

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 15000
