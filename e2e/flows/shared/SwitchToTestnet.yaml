appId: org.stellar.freighterdev
---
# Shared flow: switch the active network to Testnet, called right after the
# wallet has been imported. Exits back to home screen. Used by the transaction
# flows that run on testnet (Send/Swap, FromDetails) and by the standalone
# ImportAndSwitchToTestnet flow.
#
# If the Mainnet account fetch flakes, an "Account not loaded" toast appears
# at the top and overlays the header (including the account switcher).
# OpenManageAccountsSheet.yaml handles it, and retries so the overlay can't
# block the network-switch tap.
#
# Timeouts on the post-switch back-nav are generous (30s) because the app
# refetches balances on the new network first; 15s was observed timing out at
# 16s on a loaded CI simulator.

# 1. Wait for the home screen to reach a steady post-load state — either the
#    unfunded account's empty state (fresh testnet-only account shown as
#    unfunded on Mainnet) or the XLM balance row (static funded Mainnet account
#    already loaded). Both are end-states, not the racy "home-screen rendered"
#    signal that the calling flows used to wait for.
- extendedWaitUntil:
    visible:
      id: home-token-XLM|unfunded-account-empty-state
    timeout: 30000

# 2. Navigate to Settings via the manage-accounts sheet (settings moved there
#    from the old header context menu). The shared flow dismisses the
#    "Account not loaded" toast if it's overlaying the header, and retries the
#    whole navigation so a late overlay cannot swallow a tap. It returns with
#    `settings-screen` visible.
- runFlow:
    file: OpenManageAccountsSheet.yaml

# Wait for change network button to be visible (confirms settings screen loaded)
- extendedWaitUntil:
    visible:
      id: change-network-button
    timeout: 15000

# Open change network screen
- tapOn:
    id: change-network-button

- extendedWaitUntil:
    visible:
      id: change-network-selector
    timeout: 15000

# Open network selector bottom sheet
- tapOn:
    id: change-network-selector

- extendedWaitUntil:
    visible:
      id: change-network-option-testnet
    timeout: 15000

- tapOn:
    id: change-network-option-testnet

# Return to home screen. Both back-nav waits allow 30s: the network switch
# triggers a balance refetch on the new network before the screens settle.
- tapOn:
    id: header-button

- extendedWaitUntil:
    visible:
      id: change-network-button
    timeout: 30000

- tapOn:
    id: header-button

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 30000
