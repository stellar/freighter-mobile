appId: org.stellar.freighterdev
---
# Shared flow: the Add wallet stack's password step. Types the wallet password
# and continues; returns on the home screen once the account work is done.
#
# Env:
#   DONE_TIMEOUT: ms to wait for the home screen (a phrase import looks its
#                 accounts up on the network first)
- extendedWaitUntil:
    visible:
      id: verify-password-continue
    timeout: 15000
- tapOn:
    id: password-input
- inputText: "TestPassword123!"
- tapOn:
    id: verify-password-continue
# Success resets navigation to the main tabs. Wait for this screen to go
# first: a screen under the stack can still count as visible, so the home
# header alone wouldn't prove the reset happened.
- extendedWaitUntil:
    notVisible:
      id: verify-password-continue
    timeout: ${DONE_TIMEOUT}
- extendedWaitUntil:
    visible:
      id: home-account-switcher
    timeout: 30000
