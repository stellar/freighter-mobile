appId: org.stellar.freighterdev
tags:
  - walletconnect
  - sign-message
  - mock-dapp
  - e2e
---
# SignMessage Mock Dapp E2E Test - Happy Path
# Tests basic WalletConnect SignMessage flow with approval on mainnet

- runFlow:
    file: ../onboarding/ImportFundedWallet.yaml

# Open WC E2E Helper FAB and create session
- tapOn:
    id: wc-e2e-helper-fab

# Wait for bottom sheet animation to complete
- scroll

# Tap Create Session button
- tapOn:
    id: wc-e2e-create-session

# Wait for session to be created
- extendedWaitUntil:
    visible:
      id: wc-e2e-copy-uri
    timeout: 5000

# Pair directly via WC E2E helper (modal will auto-close after pairing)
- tapOn:
    id: wc-e2e-pair-uri

# Wait for session proposal
- extendedWaitUntil:
    visible:
      id: session-proposal-confirm-button
    timeout: 20000

# Tap confirm button
- tapOn:
    id: session-proposal-confirm-button

# Wait for connection approval
- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000

# Request sign message using WC E2E Helper
- tapOn:
    id: wc-e2e-helper-fab

# Wait for modal to open and message input to be visible
- extendedWaitUntil:
    visible:
      id: wc-e2e-message-input
    timeout: 5000

# Fill in message
- tapOn:
    id: wc-e2e-message-input

- inputText:
    "Hello from E2E test! Please sign this message to verify your wallet."

# Dismiss keyboard before tapping the sign button, with the keyboard's return
# key as a user would. Not hideKeyboard: on iOS it swipes from the middle of
# the screen, and whichever helper button sits there gets pressed (Copy WC URI
# closes the modal); on Android its back press can close the modal instead.
- pressKey: Enter

# Make sure the sign button is visible and tap it to send the WC request.
#
# Once the keyboard is down the modal's ScrollView springs back toward the top,
# clipping this button (the last item) below the fold. scrollUntilVisible
# alone is a no-op here: iOS lists the clipped button in the accessibility
# tree at its layout position, so Maestro thinks it is already visible and
# never scrolls — the tap then lands on empty space, onPress never fires, no
# WC request is sent, and sign-message-title times out. Force a real scroll: a
# plain scroll moves the content and centerElement keeps the button on-screen.
- scroll
- scrollUntilVisible:
    element:
      id: wc-e2e-request-sign
    direction: DOWN
    centerElement: true

# Request sign message - modal will auto-close after request
- tapOn:
    id: wc-e2e-request-sign

# Wait for SignMessage modal
- extendedWaitUntil:
    visible:
      id: sign-message-title
    timeout: 10000

# Verify message and buttons are visible
- assertVisible:
    id: message-display
- assertVisible:
    id: dapp-request-confirm-button

# Approve the signature
- tapOn:
    id: dapp-request-confirm-button

# Verify success toast appears
- extendedWaitUntil:
    visible:
      text: "Message successfully signed!"
    timeout: 5000
